name: Release

on:
  push:
    tags:
      - 'pkf-tasks@*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Pkl package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SHA pin: ci.yml と同じ理由 (composite action の @@ 2重 parse 問題)
      - name: Setup pkfire (pkfire@0.6.0)
        uses: mizchi/pkfire@45a60a4e81638506f7c12d88fdd1251a56e64b22
      - name: Extract version from tag
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#pkf-tasks@}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Verify PklProject version matches tag
        env:
          EXPECTED: ${{ steps.ver.outputs.version }}
        working-directory: tasks
        run: |
          declared=$(grep -E '^\s+version = ' PklProject | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$declared" != "$EXPECTED" ]; then
            echo "::error::PklProject declares version=$declared but tag is pkf-tasks@$EXPECTED" >&2
            exit 1
          fi
      - name: Package
        working-directory: tasks
        run: |
          pkl project resolve
          pkl project package
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        working-directory: tasks
        run: |
          gh release upload "$REF_NAME" \
            ".out/pkf-tasks@${VERSION}/pkf-tasks@${VERSION}" \
            ".out/pkf-tasks@${VERSION}/pkf-tasks@${VERSION}.sha256" \
            ".out/pkf-tasks@${VERSION}/pkf-tasks@${VERSION}.zip" \
            ".out/pkf-tasks@${VERSION}/pkf-tasks@${VERSION}.zip.sha256" \
            --clobber
