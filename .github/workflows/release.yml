name: Release

on:
  push:
    branches: [main]
    paths:
      - "tasks/PklProject"
  workflow_dispatch: # 手動 trigger (initial release や paths 漏れ救済用)

# 同一 ref への並行 release を直列化。既走中の run は kill せず待たせる
# (途中で kill すると tag だけ残る等の不整合パスを避けるため)。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.current }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # bump-semver の vcs:latest-tag() で全 tag が必要

      - name: Install bump-semver (dogfood for version compare)
        run: |
          LATEST=$(gh release list --repo kawaz/bump-semver --limit 1 --json tagName -q '.[0].tagName' | sed 's/^v//')
          curl -fsSL "https://github.com/kawaz/bump-semver/releases/download/v${LATEST}/bump-semver-linux-amd64" -o /usr/local/bin/bump-semver
          chmod +x /usr/local/bin/bump-semver
          bump-semver --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check PklProject version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          CURRENT_VERSION=$(grep -E '^\s+version = ' tasks/PklProject | sed -E 's/.*"([^"]+)".*/\1/')
          echo "current=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = "0.0.0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Placeholder version (${CURRENT_VERSION:-empty}); skipping release."
            exit 0
          fi

          # semver 形式の検証 (bump-semver get -qq で exit code のみ)
          if ! bump-semver get "$CURRENT_VERSION" -qq; then
            echo "::error::Invalid PklProject version: ${CURRENT_VERSION}"
            exit 1
          fi

          # 既存 tag より大きいか (二重リリース防止)。
          # vcs:latest-tag() は monorepo-style `pkf-tasks@X.Y.Z` も @ peel fallback で認識
          set +e
          bump-semver compare gt "$CURRENT_VERSION" 'vcs:latest-tag()' --vcs git
          CMP_EXIT=$?
          set -e
          case "$CMP_EXIT" in
            0) ;;  # CURRENT > latest: release 続行
            1)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Version pkf-tasks@${CURRENT_VERSION} is not greater than latest tag; skipping release."
              exit 0
              ;;
            2)
              echo "compare gt exited 2 (no tags yet?); assuming first release"
              ;;
            *)
              echo "::error::Unexpected exit code from bump-semver compare: ${CMP_EXIT}"
              exit 1
              ;;
          esac

          # GH 側の release 存在確認 (compare で通っても念のため)
          if gh release view "pkf-tasks@${CURRENT_VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release pkf-tasks@${CURRENT_VERSION} already exists; skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: pkf-tasks@${CURRENT_VERSION}"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pkfire (pkfire@0.6.0)
        uses: mizchi/pkfire@v0.6.0
      - name: Cache Pkl packages
        uses: actions/cache@v4
        with:
          path: ~/.pkl/cache
          key: pkl-cache-${{ hashFiles('tasks/PklProject.deps.json') }}
          restore-keys: |
            pkl-cache-
      - name: Package
        working-directory: tasks
        run: |
          pkl project resolve
          pkl project package
          ls -la .out/ # diagnostic: confirm package output path
      - uses: actions/upload-artifact@v7
        with:
          name: pkf-tasks-package
          # path に glob (`pkf-tasks@*/`) を使うと upload-artifact@v7 で
          # 末尾スラッシュ + `@` の組み合わせが match しない事象があったため、
          # check-version の output から具体 version を埋めて確定 path にする
          path: tasks/.out/pkf-tasks@${{ needs.check-version.outputs.version }}/
          if-no-files-found: error

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: pkf-tasks-package
          path: artifacts/

      - name: Diagnostic — list downloaded artifact contents
        run: ls -la artifacts/

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # CHANGELOG.md の `## <VERSION> ` セクションを抽出 (次の `## <数字>` 直前まで)。
          # section が見つからなければ terse fallback で release は通す
          notes=$(awk -v ver="$VERSION" '
            $0 ~ "^## " ver " " { flag=1; print; next }
            flag && $0 ~ "^## [0-9]" { flag=0 }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="Release pkf-tasks@${VERSION}. See CHANGELOG.md for details."
          fi
          printf '%s\n' "$notes" > /tmp/release-notes.md

      - name: Create release with tag + assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Tag 体系:
          #   - PRIMARY (= GH Release が bind するもの): pkf-tasks@<version>
          #     Pkl package proxy (pkg.pkl-lang.org) が GitHub Releases から
          #     asset を fetch する URL 規約上必須。「<package-name>@<version>」
          #     形式は Pkl エコシステムの要求で、kawaz としては設計上イリーガル
          #     なケース (Pkl 都合で仕方なく付けている)。
          #   - PLAIN (= 慣習的 SemVer tag、bump-semver の vcs:latest-tag() が
          #     拾う「よくあるバージョンタグ」): v<version>
          #     こちらが本来の基本形。
          #
          # 順序が重要: PLAIN tag を先に push してから PRIMARY release を作成する。
          # 逆順だと「Release 作成成功 → tag push 失敗 (branch protection / 瞬断 /
          # 既存 tag)」で永続的に GH Release だけ存在する不整合になる。
          # check-version は PRIMARY release の存在しか見ていないので、それ以降の
          # re-run でも checkin が skip 判定になり plain tag が永久に補填されない。
          #
          # actions/download-artifact@v8 は upload 元の dir 階層を保持せず path: 直下に
          # file を展開するため、artifact 内の 4 file は artifacts/${PKL_TAG} 等に配置。
          PKL_TAG="pkf-tasks@${VERSION}"
          PLAIN_TAG="v${VERSION}"

          # 1) PLAIN tag: 同じ commit に v<version> tag を annotated tag として
          #    作成 + push。既存 (= 過去の手動補填 / 別 run で push 済) なら skip。
          if git ls-remote --tags --exit-code origin "$PLAIN_TAG" >/dev/null 2>&1; then
            echo "::notice::$PLAIN_TAG already exists on origin; skipping plain tag push."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$PLAIN_TAG" "$COMMIT_SHA" -m "Release $PLAIN_TAG"
            git push origin "$PLAIN_TAG"
          fi

          # 2) PRIMARY release: gh release create が pkl tag を自動作成 + Release 作成。
          #    check-version 段階で release 存在チェック済なのでここでは常に新規作成。
          gh release create "$PKL_TAG" \
            --repo "$REPO" \
            --title "$PKL_TAG" \
            --target "$COMMIT_SHA" \
            --notes-file /tmp/release-notes.md \
            "artifacts/${PKL_TAG}" \
            "artifacts/${PKL_TAG}.sha256" \
            "artifacts/${PKL_TAG}.zip" \
            "artifacts/${PKL_TAG}.zip.sha256"
