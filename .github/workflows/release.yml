name: Release

on:
  push:
    tags:
      - 'pkf-tasks@*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Pkl package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Pkl packages
        uses: actions/cache@v4
        with:
          path: ~/.pkl/cache
          key: pkl-cache-${{ hashFiles('tasks/PklProject.deps.json') }}
          restore-keys: |
            pkl-cache-
      - name: Setup pkfire (installs pkl)
        uses: mizchi/pkfire@pkfire@0.4.0
      - name: Extract version from tag
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#pkf-tasks@}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${version}"
      - name: Verify PklProject version matches tag
        env:
          EXPECTED: ${{ steps.ver.outputs.version }}
        working-directory: tasks
        run: |
          declared=$(grep -E '^\s+version = ' PklProject | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$declared" != "$EXPECTED" ]; then
            echo "::error::PklProject declares version=$declared but tag is pkf-tasks@$EXPECTED" >&2
            exit 1
          fi
      - name: Resolve dependencies + package
        working-directory: tasks
        run: |
          pkl project resolve
          pkl project package
      - name: Upload package assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        working-directory: tasks
        run: |
          gh release upload "$REF_NAME" \
            ".out/pkf-tasks@${VERSION}/pkf-tasks@${VERSION}" \
            ".out/pkf-tasks@${VERSION}/pkf-tasks@${VERSION}.sha256" \
            ".out/pkf-tasks@${VERSION}/pkf-tasks@${VERSION}.zip" \
            ".out/pkf-tasks@${VERSION}/pkf-tasks@${VERSION}.zip.sha256" \
            --clobber
