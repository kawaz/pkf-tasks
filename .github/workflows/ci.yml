name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: pkf run ci (self-dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Pkl packages
        uses: actions/cache@v4
        with:
          path: ~/.pkl/cache
          key: pkl-cache-${{ hashFiles('tasks/PklProject.deps.json') }}
          restore-keys: |
            pkl-cache-
      # SHA pin: mizchi/pkfire の tag 名は `pkfire@<version>` 形式で `@` を
      # 含むため、`uses: <repo>@<ref>` 構文と相性が悪く GHA parser が
      # file-level error を起こす (DR-0004 参照)。pkfire@0.6.0 に対応する
      # commit SHA を直接指して回避。
      - name: Setup pkfire (pkfire@0.6.0)
        uses: mizchi/pkfire@45a60a4e81638506f7c12d88fdd1251a56e64b22
      - name: Verify pkl / pkf versions
        run: |
          pkl --version
          pkf version
      # Taskfile.pkl の `ci` task が以下を集約:
      #   - lint:pkl    (pkl format -w で auto-fix を許容)
      #   - smokeEval   (各 module を pkl eval)
      #   - packageBuild (pkl project resolve + package; --skip-publish-check)
      #   - docs:check-translations (翻訳ペア整合性)
      # bash の自前実装は Taskfile.pkl 側に集約し dogfood する。
      - name: Run CI (self-dogfood via pkf-tasks)
        run: pkf run ci
