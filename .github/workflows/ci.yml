name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: pkf run ci (self-dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Pkl packages
        uses: actions/cache@v4
        with:
          path: ~/.pkl/cache
          key: pkl-cache-${{ hashFiles('tasks/PklProject.deps.json') }}
          restore-keys: |
            pkl-cache-
      # pkfire 0.5.0+ で action 用の `v<version>` tag が upstream に切られたので
      # `@v0.6.0` (or `@v0` で major-floating) で参照可能 (DR-0004 archived)。
      - name: Setup pkfire (pkfire@0.6.0)
        uses: mizchi/pkfire@v0.6.0
      - name: Verify pkl / pkf versions
        run: |
          pkl --version
          pkf version
      # Taskfile.pkl の `ci` task が以下を集約:
      #   - lint:pkl    (pkl format -w で auto-fix を許容)
      #   - smokeEval   (各 module を pkl eval)
      #   - packageBuild (pkl project resolve + package; --skip-publish-check)
      #   - docs:check-translations (翻訳ペア整合性)
      # bash の自前実装は Taskfile.pkl 側に集約し dogfood する。
      - name: Run CI (self-dogfood via pkf-tasks)
        run: pkf run ci
