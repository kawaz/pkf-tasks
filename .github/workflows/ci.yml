name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pkl-smoke:
    name: Pkl module eval smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Pkl packages
        uses: actions/cache@v4
        with:
          path: ~/.pkl/cache
          key: pkl-cache-${{ hashFiles('tasks/PklProject.deps.json') }}
          restore-keys: |
            pkl-cache-
      # debug: 「@@」が壊しているのか、「single @」で動くのか検証中。
      # 結果次第で DR-0004 の前提が変わる。
      - name: Setup pkfire (single-@ tag: 0.4.0)
        uses: mizchi/pkfire@0.4.0
      - run: pkl --version
